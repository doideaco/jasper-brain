name: Scarlet
tagline: We pull medical technology from the future to solve human health
description: Scarlet is the global AI certification body. We are a Notified Body under EU MDR (2017/745) and a UK Approved Body under UK MDR 2002, specialised in software as a medical device and AI-driven diagnostics. We remove unnecessary delays from every regulatory approval we do so people can access life-changing medical technology sooner.

